<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regulus Sales OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F2EF;--bg2:#F8F8F6;--sf:#FFFFFF;--ink:#111111;--slate:#272727;--muted:#6E6E6A;--bd:#E7E7E3;--bd2:#D4D4D0;--navy:#111111;--navy2:#272727;--green:#2F8F3A;--green2:#EAF3EC;--lime:#8A8A86;--amber:#A8741C;--amber2:#F8F1E2;--red:#A83A3A;--red2:#F8ECEC;--r:6px;--side:224px;--ctx:288px;--focus:0 0 0 3px rgba(39,39,39,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--slate);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Montserrat,Inter,sans-serif;color:var(--ink);margin:0;letter-spacing:-.01em}
h1{font-size:20px;font-weight:700}h2{font-size:15px;font-weight:700}h3{font-size:13px;font-weight:700}
button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
.sr{position:absolute;left:-9999px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font:600 10.5px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lbl.g{color:var(--muted)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside.side{background:#111111;color:#A9A9A5;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.logo img{width:36px;height:36px;border-radius:8px;background:#fff;padding:3px}
.logo b{font:700 12.5px Montserrat;color:#fff;letter-spacing:.06em;display:block}.logo small{font-size:10.5px;color:#7A7A76;display:block}
.ng{margin-top:10px}.ng .lbl{padding:0 10px 6px;color:#6A6A66;font-size:10px}
.nb{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:#A9A9A5;padding:8px 10px;border-radius:6px;font-weight:500;font-size:13px;text-align:left;min-height:36px;transition:background .12s,color .12s}
.nb:hover{background:rgba(255,255,255,.06);color:#fff}.nb.on{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 2px 0 0 #fff}
.nb.live{color:#fff;font-weight:600}.nb.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:-4px}.nb.live.on{box-shadow:inset 2px 0 0 #fff}
.side .foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:#6A6A66;border-top:1px solid rgba(255,255,255,.08)}
.cmd{position:sticky;top:0;z-index:30;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 20px;min-height:56px}
.cmd .search{flex:1;max-width:420px;position:relative;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:0 10px;height:36px;color:var(--muted)}
.cmd .search input{border:0;background:transparent;outline:0;width:100%;font-size:13px;color:var(--ink)}.cmd .search input:focus{box-shadow:none}
.cmd .search kbd{font:500 10px "JetBrains Mono",monospace;border:1px solid var(--bd2);border-radius:4px;padding:1px 5px;color:var(--muted)}
.st{display:flex;flex-direction:column;line-height:1.2;padding:0 12px;border-left:1px solid var(--bd)}.st .lbl{font-size:9.5px}.st b{font-size:12.5px;color:var(--ink);font-weight:600}
.qa{display:flex;gap:6px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--bd2);background:var(--sf);border-radius:6px;font-weight:600;font-size:12.5px;color:var(--slate);transition:background .12s,border-color .12s,color .12s;white-space:nowrap}
.btn:hover{background:var(--bg);border-color:#B9C0C9;color:var(--ink)}.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}.btn.p:hover{background:#272727}.btn.d{background:var(--navy);border-color:var(--navy);color:#fff}.btn.d:hover{background:var(--navy2)}
.btn.sm{height:28px;padding:0 9px;font-size:11.5px}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--sf);padding:0 10px;height:32px;font-size:11.5px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--ink);color:#fff}
.wrap{display:grid;grid-template-columns:1fr var(--ctx);gap:0;min-height:calc(100vh - 56px)}
main{padding:28px 32px 100px;min-width:0;max-width:1180px}
aside.ctx{border-left:1px solid var(--bd);background:var(--bg2);padding:18px 16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.ctx h3{margin-bottom:10px}
section.tab{display:none}section.tab.on{display:block}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.ph p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:760px}
/* ---------- panels ---------- */
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);min-height:42px}
.panel>.bd{padding:14px}.panel .bd.tight{padding:0}
.row{display:flex;align-items:center;gap:10px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;font:600 10.5px Inter;letter-spacing:.05em;text-transform:uppercase;background:var(--bg);color:var(--muted);border:1px solid var(--bd);white-space:nowrap}
.badge.g{background:var(--green2);color:var(--green);border-color:#CBE6D0}.badge.a{background:var(--amber2);color:var(--amber);border-color:#EED9B0}.badge.r{background:var(--red2);color:var(--red);border-color:#EFCACA}.badge.n{background:var(--bg);color:var(--ink);border-color:var(--bd2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--bd2)}.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}
.note{border-left:3px solid var(--bd2);padding:8px 12px;font-size:13px;color:var(--slate);background:var(--bg2);border-radius:0 6px 6px 0;margin:8px 0}.note.g{border-color:var(--green)}.note.a{border-color:var(--amber)}.note.r{border-color:var(--red)}.note.n{border-color:var(--ink)}
.nba{background:#111111;color:#fff;border-radius:var(--r);padding:12px 14px;margin:10px 0}.nba .lbl{color:#A9A9A5}.nba .v{font:600 13.5px Inter;margin-top:4px;line-height:1.4}
.say{position:relative;background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:10px 92px 10px 12px;font-size:13.5px;color:var(--ink);white-space:pre-line;margin:6px 0;line-height:1.5}
.say.q{background:var(--sf)}
.copy{position:absolute;top:6px;right:6px;height:28px;padding:0 10px;border:1px solid var(--bd2);background:var(--sf);border-radius:5px;font:600 11px Inter;letter-spacing:.04em;color:var(--slate);display:inline-flex;align-items:center;gap:5px}
.copy:hover{border-color:var(--ink);color:var(--ink)}.copy.ok{background:var(--green);border-color:var(--green);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{height:30px;padding:0 11px;border:1px solid var(--bd2);background:var(--sf);border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);transition:.12s}
.chip:hover{border-color:var(--navy);color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
details{border-top:1px solid var(--bd)}details summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:12.5px;color:var(--slate);list-style:none;display:flex;align-items:center;gap:8px}details summary::-webkit-details-marker{display:none}
details summary:before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}details[open] summary:before{transform:rotate(45deg)}
details .db{padding:0 0 12px;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:var(--red2);color:var(--red);border-radius:4px;padding:3px 8px;font-size:12px;font-weight:500}.tags.n span{background:var(--bg);color:var(--ink);border:1px solid var(--bd)}.tags.g span{background:var(--green2);color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:8px 12px;font:600 10.5px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--bd);background:var(--bg2)}
td{padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:top}tr:last-child td{border-bottom:0}td.k{font-weight:600;color:var(--ink)}td.num{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.list{margin:0;padding-left:18px}.list li{margin:3px 0}
/* stages strip */
.strip{display:flex;gap:4px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.stp{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--bd);background:var(--sf);border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.stp:hover{border-color:var(--navy);color:var(--ink)}.stp.on{background:var(--ink);border-color:var(--ink);color:#fff}.stp .n{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.6}
.prog{height:4px;background:var(--bd);border-radius:999px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--bd2);width:0;transition:width .25s}.prog i.ok{background:var(--green)}.prog i.a{background:var(--amber)}.prog i.r{background:var(--red)}
/* live */
.live{display:grid;grid-template-columns:250px 1fr 270px;gap:14px;align-items:start}
.sits{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);max-height:calc(100vh - 200px);overflow:auto}
.sit{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--bd);padding:9px 12px;font-size:12.5px;font-weight:500;color:var(--slate);min-height:40px;line-height:1.35}
.sit:hover{background:var(--bg2);color:var(--ink)}.sit.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--ink)}
.sec{padding:12px 0;border-bottom:1px solid var(--bd)}.sec:last-child{border-bottom:0}.sec .lbl{margin-bottom:6px}.sec p{margin:0;font-size:13.5px;color:var(--ink)}
.ck label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px}.ck label:last-child{border-bottom:0}.ck input{width:17px;height:17px;margin-top:1px;accent-color:var(--green)}.ck label.done{color:var(--muted);text-decoration:line-through}
/* kpi */
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.kv:last-child{border-bottom:0}
.kv .m{font-size:13px;color:var(--slate)}.kv .v{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}.kv .v small{color:var(--muted);font-weight:500}
.kv .prog{grid-column:1/-1;margin-top:-2px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--bd2);border-radius:6px;overflow:hidden}.stepper button{border:0;background:var(--sf);width:32px;height:30px;font-weight:600;color:var(--slate)}.stepper button:hover{background:var(--bg)}.stepper b{width:40px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink)}
.rolecard{border:1px solid var(--bd);border-radius:var(--r);padding:12px;background:var(--sf);text-align:left;transition:.12s}.rolecard:hover{border-color:var(--navy)}.rolecard.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.rolecard b{display:block;font:700 12.5px Montserrat;color:var(--ink);margin-bottom:4px}.rolecard span{font-size:12px;color:var(--muted)}
input.t{width:70px;height:28px;border:1px solid var(--bd2);border-radius:5px;padding:0 8px;font-family:"JetBrains Mono",monospace;font-size:12.5px;text-align:right}
.fun{display:grid;gap:6px}.fun .fr{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:12.5px}.fun .fr .bar{height:18px;background:var(--bg);border-radius:4px;overflow:hidden}.fun .fr .bar i{display:block;height:100%;background:#272727;opacity:.85}.fun .fr .n{font-family:"JetBrains Mono",monospace;text-align:right;color:var(--ink);font-weight:600}
.ob .o{font:700 14px Montserrat;color:var(--ink)}
.tree .node{border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin:8px 0;background:var(--sf)}.tree .node.on{border-color:var(--ink)}
.quiz .opt{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;margin:6px 0;font-size:13px}.quiz .opt.good{border-color:var(--green);background:var(--green2)}.quiz .opt.badc{border-color:var(--red);background:var(--red2)}
.results{position:absolute;top:40px;left:0;right:0;background:var(--sf);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 32px rgba(17,24,39,.14);max-height:70vh;overflow:auto;z-index:40;color:var(--ink)}
.results .it{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd);align-items:center;font-size:12.5px}.results .it .c{font:600 9.5px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.results .it .t{font-weight:600}.results .it .x{color:var(--muted);font-size:12px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--sf);border-left:1px solid var(--bd);box-shadow:-12px 0 32px rgba(17,24,39,.15);transform:translateX(100%);transition:transform .2s;z-index:60;overflow:auto;padding:18px 20px}.drawer.on{transform:none}
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.35);opacity:0;pointer-events:none;transition:.2s;z-index:55}.scrim.on{opacity:1;pointer-events:auto}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:70}.toast.on{opacity:1}
.bnav{display:none}
.hint{font-size:12px;color:var(--muted)}
.today{display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap;padding:6px 0 18px;border-bottom:1px solid var(--bd);margin-bottom:18px}.today .date{font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.02em;line-height:1.1}.today .rolename{font:700 22px Montserrat;color:var(--ink);letter-spacing:-.01em}
table.plan tr.grp td{font:600 10.5px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:var(--bg2);padding:6px 12px}table.plan td b.ok{color:var(--green)}table.plan td b.over{color:#1F6B2A}table.plan tr.done td.k{color:var(--muted)}
.truth{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.truth div{border:1px solid var(--bd);border-radius:6px;padding:10px 12px;font:600 12px Inter;color:var(--ink);background:var(--sf)}.truth div span{display:block;color:var(--muted);margin-top:2px}
.frame{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.frame span{font:600 11px Inter;letter-spacing:.06em;color:var(--ink);background:var(--bg);border:1px solid var(--bd);padding:4px 9px;border-radius:4px}.frame i{color:var(--muted);font-style:normal}
@media(max-width:1280px){.wrap{grid-template-columns:1fr}aside.ctx{display:none}.live{grid-template-columns:230px 1fr}.live .rcol{grid-column:1/-1}}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside.side{display:none}.cmd{padding:8px 12px}.st,.qa{display:none}main{padding:14px 12px 96px}.live{grid-template-columns:1fr}.sits{max-height:none}.say{padding:10px 12px 46px}.copy{top:auto;bottom:6px;height:34px;padding:0 14px;font-size:12px}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#111111;border-top:1px solid #2A2A2A;z-index:50;padding-bottom:env(safe-area-inset-bottom)}.bnav button{background:transparent;border:0;color:#8A8A86;font:600 10px Inter;letter-spacing:.05em;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}.bnav button.on{color:#fff}.bnav button.on svg{stroke:#fff}
 .mnba{position:fixed;bottom:60px;left:8px;right:8px;z-index:45;background:#111111;color:#fff;border-radius:8px;padding:8px 12px;font-size:12.5px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}.mnba.on{display:block}.mnba .lbl{color:#A9A9A5;font-size:9.5px}}
</style>
</head>
<body>
<a class="sr" href="#main">Saltar al contenido</a>

<script>
const D = {"brand": {"name": "Regulus Business Solutions", "title": "Regulus Sales Bible", "subtitle": "Manual Maestro de Ventas · Limpieza Comercial", "version": "v4.0 · Septiembre 2026", "navy": "#0E2A47", "navy2": "#173E6B", "green": "#2F8F3A", "lime": "#7DC242", "ink": "#1B2430", "muted": "#5B6673", "paper": "#F6F8F5", "line": "#D9E0DA"}, "principles": [["Escucha más de lo que hablas", "Si hablas más del 40% de una llamada outbound (20% en inbound), estás perdiendo la información que cierra la venta. El cliente habla; tú diriges con preguntas."], ["La confianza se construye con acciones, no con promesas", "No se genera diciendo “somos confiables”. Se genera cumpliendo lo que dijiste que ibas a hacer: la propuesta a la hora prometida, la llamada el día acordado."], ["Comprende antes de recomendar", "Ninguna solución se presenta sin al menos dos o tres preguntas reales sobre cómo opera el prospecto. La mayoría de las ventas no se pierden por precio: se pierden porque el representante presentó antes de entender."], ["Vendes confianza, no una lista de servicios", "Nadie cambia de proveedor de limpieza por una lista de servicios más larga. Las personas no compran limpieza; compran tranquilidad, cumplimiento y la certeza de que su propiedad está en buenas manos."]], "mindset": {"intro": "Antes de contestar o marcar cualquier llamada, recuerda: las personas no buscan una empresa de limpieza. Buscan resolver una situación específica.", "reasons": ["Un proveedor que no cumple", "Una nueva propiedad o ubicación", "Un edificio recién construido (post-construction)", "Una inspección próxima", "Quejas de residentes, empleados o visitantes", "Problemas de calidad o consistencia", "Falta de personal interno", "Crecimiento de la empresa", "Tardanzas o inconsistencias en el servicio", "Contrato de limpieza que finaliza o se perdió"], "results": ["Instalaciones limpias de forma consistente", "Un proveedor confiable", "Comunicación rápida y un contacto directo", "Menos quejas", "Cumplimiento de horarios", "Personal capacitado y supervisión constante", "Tranquilidad"]}, "channels": [{"id": "inbound", "name": "Inbound (IB)", "tag": "El cliente llama", "desc": "El cliente ya dio el primer paso: existe interés, necesidad o problema. Objetivo: comprender, calificar, generar confianza y guiar al siguiente paso (walkthrough, propuesta o venta directa).", "steps": ["Responder antes del 3er timbre, sonriendo", "Opening breve y consistente", "Dejar hablar; ampliar con una pregunta abierta", "Descubrimiento (operación → necesidad → prioridades → dolor → impacto)", "Confirmar lo entendido", "Calificar", "Presentar solución (Problema–Solución–Beneficio)", "Objeciones", "Cierre natural hacia el siguiente paso", "Upselling (solo después del sí)", "Confirmar próximos pasos", "CRM antes de la siguiente llamada"]}, {"id": "outbound", "name": "Outbound (OB)", "tag": "Nosotros llamamos", "desc": "Una llamada se gana o se pierde antes de marcar. La llamada existe para descubrir el proceso de compra del prospecto y ganar una razón legítima para volver a hablar — no para vender por teléfono.", "steps": ["Investigación mínima + vendor portal", "Razón legítima para llamar (una frase)", "Opening con pregunta de ayuda + silencio", "Pasar recepción → decisor de vendors", "Descubrir cómo compran, quién decide, cuándo renuevan", "Posicionar valor según tipo de prospecto", "Leer señales de compra y de riesgo", "Objeciones (ya tenemos proveedor / send me an email)", "Cerrar hacia walkthrough o fecha de seguimiento", "Checklist antes de colgar", "CRM inmediatamente"]}, {"id": "linkedin", "name": "LinkedIn Outreach", "tag": "Red + conversación", "desc": "Tres fases: construir una red estratégica de decisores locales, abrir una conversación genuina y convertirla en estatus de proveedor, referidos o negocio — sin sentirse como venta agresiva.", "steps": ["Fase 1 — Definir área, buscar por puesto/industria/ubicación", "Calificar perfil antes de conectar", "Solicitud personalizada (20–30/día, 100–150/semana)", "Interactuar con su contenido antes de escribir", "Fase 2 — Mensaje inicial (ángulo Alianza o Proveedor)", "Respuesta positiva → llamada / video / walkthrough", "Fase 3 — Seguimiento 1 (~2 semanas) y 2 (~2–3 meses)", "Sin oportunidad → base de prospectos fríos multicanal"]}, {"id": "cold", "name": "Multicanal frío", "tag": "Email · Llamada · Texto", "desc": "Para contactos de la base fría: investigar, revisar si existe proceso formal de proveedores (completarlo directo) y, si no existe, contactar por email, llamada y texto espaciando canales para que no se sienta como bombardeo.", "steps": ["Investigar empresa (tamaño, proveedores, actividad reciente)", "Buscar vendor application / procurement", "Si existe proceso formal → completarlo", "Si no → Email (día 1)", "Llamada (día 3–4)", "Texto de confirmación (día 6–7)", "Registrar en tracker; nutrir mensualmente"]}], "live": [{"ch": "inbound", "sit": "Nueva consulta (new inquiry)", "what": "El cliente ya dio el primer paso: existe interés, necesidad o problema. Los primeros 30 segundos definen la percepción.", "do": "Contesta antes del 3er timbre, sonriendo. Opening breve. Después, calla y deja que explique. Amplía con una pregunta abierta.", "say": ["Good morning, thank you for calling [Company Name]. My name is X. How may I assist you today?", "I'd be happy to help. Could you tell me a little more about what you're looking for — and what made you start looking now?"], "ask": ["Can you tell me a little about your facility?", "How is the building currently being maintained?"], "watch": "Palabras que repite, tono, urgencia. El motivo real casi nunca es la primera frase.", "avoid": ["Enumerar servicios", "Hablar de precio", "Interrumpir", "Asumir la necesidad"], "next": "Continuar descubrimiento (operación → necesidad → dolor → impacto).", "crm": "Contacto, tipo de instalación, necesidad, próximo paso y fecha.", "st": 2}, {"ch": "inbound", "sit": "El cliente explica un problema", "what": "Está describiendo el dolor (missed cleanings, mala comunicación, calidad). Es la información más valiosa de la llamada.", "do": "No cambies de tema ni presentes. Profundiza en frecuencia e impacto. Refleja y resume.", "say": ["How often does that happen?", "How has that affected your staff or tenants?", "It sounds like consistency is extremely important to your team."], "ask": ["Has that created any additional issues?", "What would it mean for you if that were solved?", "If you could change one thing about your current situation, what would it be?"], "watch": "Impacto operativo (quejas, tiempo, dinero). Cuanto mayor el impacto, mayor la urgencia real.", "avoid": ["Presentar la solución de inmediato", "Criticar al proveedor actual"], "next": "Confirmar lo entendido → calificar.", "crm": "Necesidad, dolor, impacto (en las palabras del cliente).", "st": 3}, {"ch": "inbound", "sit": "El cliente pide el precio", "what": "Pregunta el precio en los primeros minutos. El precio es parte del descubrimiento: entiende el contexto de precio antes de dar un número.", "do": "No rechaces la conversación de precio. Aclara servicio, pregunta si ya tiene presupuesto o estructura, reúne alcance mínimo y explica cuándo el número es preliminar.", "say": ["I'd be happy to talk about pricing. Before I do, let me ask a few questions so I'm giving you a number that actually makes sense for your facility.", "Do you already have an established budget or price range for this service?"], "ask": ["Is your current provider charging based on square footage, frequency, scope, or another structure?", "What services are included in that price?", "Is that the current rate you're paying, or the budget you're working with for a new provider?"], "watch": "Si el cliente ya tiene una estructura (sq ft, por unidad, contrato, bid) — eso define cómo se cotiza esta cuenta.", "avoid": ["Inventar un número", "Prometer precio final sin alcance", "Rechazar o aceptar automáticamente su rango"], "next": "Árbol de decisión de precio → ballpark si aplica → walkthrough / propuesta.", "crm": "Estructura de precio del cliente, presupuesto/rango, qué incluye.", "st": 3}, {"ch": "inbound", "sit": "El cliente pide un ballpark", "what": "Quiere una idea general. Un ballpark no es un rechazo automático: se da cuando hay alcance mínimo y se explica que es preliminar.", "do": "1) Aclara el servicio. 2) Pregunta si ya tiene rango. 3) Reúne alcance mínimo (sq ft, frecuencia, condición). 4) Da ballpark solo si es apropiado y hay precio aprobado. 5) Explica que es preliminar. 6) Fija el siguiente paso.", "say": ["I'd be happy to give you a ballpark so you have an idea of what to expect. Let me ask a couple of questions about the size and scope first so I'm not giving you a number that doesn't make sense for your facility.", "That would give you a general idea of where the pricing could fall. Once we understand the actual conditions and scope, we can determine what makes the most sense."], "ask": ["Which service are we talking about — recurring cleaning, a one-time deep clean, post-construction?", "Roughly how many square feet, and how often would you need service?", "What's the current condition of the space?"], "watch": "Si ya tiene un rango: “That's helpful to know. Let me make sure I understand exactly what's included in that range, because the scope and condition can make a significant difference.”", "avoid": ["Tratar el ballpark como propuesta final", "Dar un número sin precio aprobado"], "next": "Explicar naturaleza preliminar → agendar walkthrough o propuesta.", "crm": "Servicio, sq ft aproximados, frecuencia, condición, rango del cliente.", "st": 3}, {"ch": "inbound", "sit": "Pregunta por disponibilidad / cuándo pueden empezar", "what": "Señal de compra: ya evalúa cómo trabajar contigo, no si trabajará contigo.", "do": "Confirma y pregunta directamente la fecha límite real. Deja de presentar; guía al siguiente paso.", "say": ["We can typically get started fairly quickly. What start date are you working toward?", "To make sure we can accommodate your preferred start date, I'd recommend scheduling the walkthrough as soon as possible."], "ask": ["Is there a deadline driving that date — a contract ending, an inspection, a new location?", "Who else needs to be involved before we start?"], "watch": "Fecha límite real = urgencia real. Otros decisores.", "avoid": ["Urgencia fabricada", "Prometer fechas sin confirmar operaciones"], "next": "Cierre por alternativas → walkthrough.", "crm": "Fecha objetivo de inicio y su causa.", "st": 8}, {"ch": "inbound", "sit": "Pregunta por seguros", "what": "“Are you insured?” es una puerta: responde y devuelve una pregunta sobre su proceso de aprobación.", "do": "Confirma General Liability y Workers' Comp. Pregunta si esos documentos son parte de su proceso de aprobación.", "say": ["Yes, absolutely — we carry General Liability and Workers' Comp. Out of curiosity, are those documents typically requested during your vendor approval process?"], "ask": ["What other documents are usually part of your approval process?", "Is there a vendor registration or compliance portal we should complete?"], "watch": "Proceso formal de vendors (portal, COI, W-9).", "avoid": ["Responder sin devolver la pregunta"], "next": "Confirmar documentación exacta → registrar proceso de compra.", "crm": "Documentos requeridos, portal.", "st": 4}, {"ch": "inbound", "sit": "Pregunta por documentos", "what": "Quiere saber qué necesitas de ellos o qué pueden pedir. Indica que ya visualiza el proceso.", "do": "Confirma exactamente qué necesitan antes de colgar y compromete el envío el mismo día.", "say": ["Of course. So I send exactly what you need — is it the COI, W-9, references, or something specific from your vendor process?", "I'll send those over today. Once you've had a chance to review, would Thursday or Friday work for a quick follow-up?"], "ask": ["Who on your team reviews vendor documents?"], "watch": "Un proceso formal implica más pasos y tiempos; captura fechas.", "avoid": ["Enviar sin acordar seguimiento"], "next": "Enviar documentos + seguimiento agendado.", "crm": "Documentos solicitados, fecha de envío, seguimiento.", "st": 4}, {"ch": "inbound", "sit": "El cliente está listo para walkthrough", "what": "Preguntas sobre visita, proceso o próximos pasos = señal de compra.", "do": "Deja de presentar. Ofrece dos opciones de fecha, nunca sí/no.", "say": ["Based on everything you've shared, the next step would be scheduling a Site Walkthrough so we can prepare an accurate proposal. Would next Tuesday morning or Wednesday afternoon work better?"], "ask": ["Will the decision maker be able to join us on the walkthrough?", "Is there anything specific you'd like us to pay attention to during the visit?"], "watch": "Quién estará presente; expectativas específicas.", "avoid": ["“Would you like to schedule a walkthrough?” (sí/no)"], "next": "Agendar walkthrough → checklist Antes.", "crm": "Fecha/hora walkthrough, asistentes, expectativas.", "st": 8}, {"ch": "inbound", "sit": "El cliente está listo para propuesta", "what": "Ya tienes la información. Compromete fecha y una llamada de revisión antes de enviar.", "do": "Nunca envíes y esperes. Agenda la revisión al mismo tiempo que prometes la propuesta.", "say": ["I'll prepare a detailed proposal based on everything we've discussed today. Once it's ready, we can review it together and answer any questions. Would you like it by email today, or should we review it together tomorrow?"], "ask": ["Who else will review the proposal on your side?", "What would make this an easy decision for you?"], "watch": "Otros decisores; criterios de comparación.", "avoid": ["“I'll send it over” sin fecha ni llamada de revisión"], "next": "Enviar a la hora prometida + llamada de revisión agendada.", "crm": "Fecha de propuesta, fecha de revisión, decisores.", "st": 10}, {"ch": "inbound", "sit": "El cliente aceptó el servicio", "what": "Confirmó el servicio principal o el siguiente paso. Ahora sí: próximos pasos claros y, si aporta valor, upsell.", "do": "Confirma qué hará la empresa, qué hará el cliente, fechas, horarios, contacto y medio. Luego handoff a operaciones.", "say": ["Perfect. Here's what happens next: I'll send the service agreement by [time], and I'll call you on [day] to confirm the start date. Is this the best number and email to reach you?"], "ask": ["Who should our team coordinate with on site for access and keys?", "Would it be helpful if I introduced you to your point of contact for operations?"], "watch": "Promesas hechas durante la venta: pásalas a operaciones.", "avoid": ["Dejar el siguiente paso indefinido"], "next": "Upsell si aporta valor → onboarding → referido.", "crm": "Acuerdo, fecha de inicio, contacto operativo, promesas.", "st": 12}, {"ch": "inbound", "sit": "Oportunidad de upsell", "what": "Solo después del sí. Asesoría relacionada con su operación, no venta adicional.", "do": "Explica el beneficio, nunca “Do you want to add another service?”. Ofrece incluirlo como opción en la propuesta.", "say": ["Many of our clients also schedule quarterly carpet cleaning to help extend the life of their flooring and maintain a more professional appearance.", "Since your property has a large amount of exterior glass, many clients in a similar situation include window cleaning as part of their maintenance schedule. Would it be helpful if I included that as an option?"], "ask": ["Are there any areas that haven't been getting the attention they need — floors, windows, exterior?"], "watch": "Solo servicios ligados a lo observado en el walkthrough o dicho por el cliente.", "avoid": ["Upsell mientras aún hay dudas del servicio principal"], "next": "Incluir como opción en propuesta / acuerdo.", "crm": "Servicios complementarios de interés.", "st": 12}, {"ch": "inbound", "sit": "“I need to think about it”", "what": "Normalmente falta información o confianza, no tiempo. Usa Labeling y una pregunta.", "do": "Reconoce, etiqueta la preocupación y pregunta qué falta para decidir. Fija una fecha concreta.", "say": ["Of course. It sounds like you want to make the best long-term decision. Is there anything specific you'd like more clarity on before deciding?", "What would make this an easy yes for you?"], "ask": ["Is it the scope, the timing, or the investment that you'd like to think through?", "Would it help if we reviewed it together on [day]?"], "watch": "La objeción real detrás (precio, otro decisor, mala experiencia).", "avoid": ["Presionar", "Colgar sin fecha"], "next": "Resolver la duda → agendar fecha de decisión.", "crm": "Objeción real, fecha de decisión.", "st": 7}, {"ch": "outbound", "sit": "Investigación completada — voy a marcar", "what": "Una llamada se gana o se pierde antes de marcar. Tienes sitio web, LinkedIn, GBP, ubicaciones, decisor, vendor portal e historial CRM.", "do": "Escribe tu razón legítima para llamar en una frase. Abre el CRM. Marca.", "say": ["Razón legítima (ejemplos): “I couldn't find your vendor process on your website.” · “I noticed you opened a new location in [City].” · “We're already approved through NetVendor and I wanted to understand the next step.”"], "ask": [], "watch": "Vendor portal existente → completa todo antes de llamar.", "avoid": ["Llamar sin abrir el sitio web", "Memorizar datos en vez de tener una razón"], "next": "Apertura con pregunta de ayuda + silencio.", "crm": "Contacto, tipo de instalación, necesidad, próximo paso y fecha.", "st": 1}, {"ch": "outbound", "sit": "Contesta la recepcionista (gatekeeper)", "what": "No decide. Su trabajo es filtrar. El tuyo: llegar al responsable de vendors con cortesía.", "do": "Pide ayuda, no vendas. Si dice “not interested”, agradece y pide el nombre del responsable.", "say": ["Good morning, this is X with [Company]. I was hoping you could help me — who normally handles your commercial cleaning vendors?", "I completely understand — thank you. Just so I don't bother the wrong person next time, who normally handles cleaning vendors? Is there a good time to reach them?"], "ask": ["Is that something handled locally or at a corporate level?"], "watch": "Nombre + cargo del decisor; mejor horario.", "avoid": ["Discutir con el filtro", "Pitch de servicios", "Decir “we're calling to sell”"], "next": "Registrar decisor → reintentar en el horario indicado.", "crm": "Nombre/cargo del decisor, mejor horario, nombre de recepción.", "st": 2}, {"ch": "outbound", "sit": "Necesito al decision maker", "what": "Sin nombre del decisor, cada llamada vuelve a empezar de cero.", "do": "Pregunta directo y con cortesía. Confirma cargo y mejor canal.", "say": ["Who would be the right person to speak with about vendor approval for cleaning services?", "Would it be alright if I reached out to them directly, or would you prefer to pass along my information?"], "ask": ["What's the best way to reach them — phone or email?"], "watch": "Múltiples decisores no identificados = riesgo.", "avoid": ["Presentar a quien no decide"], "next": "Identificar decisor → contactar.", "crm": "Decision maker.", "st": 2}, {"ch": "outbound", "sit": "Existe un vendor portal", "what": "La empresa publica su proceso (Vendor Registration, Become a Vendor, Procurement, Compliance, Bids & RFPs).", "do": "Completa todo lo posible antes de llamar: cuenta, COI, W-9, licencia, referencias. Llama para preguntar el siguiente paso, no cómo aplicar.", "say": ["Good morning, this is X with [Company]. We've completed your vendor registration and I wanted to check what the next steps look like on your end."], "ask": ["How does your team typically evaluate new vendors once they're in the system?", "Who reviews the applications?"], "watch": "Tiempos de revisión, quién aprueba.", "avoid": ["Llamar antes de completar el portal"], "next": "Registrar proceso de compra → seguimiento en fecha de revisión.", "crm": "Portal, estado de aplicación, fecha de revisión.", "st": 1}, {"ch": "outbound", "sit": "Ya estamos precalificados", "what": "Precalificado (NetVendor, Compliance Depot, RealPage, Avetta) no es aprobado.", "do": "No preguntes cómo aplicar; pregunta cuál es el siguiente paso y cómo evalúan.", "say": ["Good morning, this is X with [Company]. I noticed we're already approved through Compliance Depot, and wanted to understand how your team typically evaluates new vendors once they're in the system."], "ask": ["When do you typically review or add vendors — is it tied to contract renewals or specific projects?"], "watch": "Renovaciones y proyectos próximos.", "avoid": ["Asumir que precalificado = trabajo"], "next": "Descubrir evaluación y timing → walkthrough / fecha.", "crm": "Estado de precalificación, proceso de evaluación.", "st": 1}, {"ch": "outbound", "sit": "No hay vendor portal ni información", "what": "La llamada existe para descubrir el proceso, no para vender.", "do": "Apertura de ayuda + silencio total. Deja que el prospecto explique.", "say": ["Good morning, this is X with [Company]. I was hoping you could help me with something — I couldn't find your vendor process on your website. Could you point me in the right direction? [silencio total]"], "ask": ["How does your team usually bring on a new cleaning vendor?"], "watch": "El silencio activa reciprocidad. Nombres, procesos, fechas.", "avoid": ["Llenar el silencio", "Hablar de años en el mercado"], "next": "Descubrir proceso y decisor → siguiente paso con fecha.", "crm": "Proceso de compra, decisor.", "st": 2}, {"ch": "outbound", "sit": "El prospecto ya tiene proveedor", "what": "Casi todos tenían proveedor antes. No es rechazo: es información de timing.", "do": "Normaliza y pregunta por la renovación. Pide permiso para volver a contactar.", "say": ["That makes sense — most of the companies we work with had a provider before us too. Out of curiosity, when does your current agreement come up for renewal?", "Would it be alright if I reached back out closer to that time?"], "ask": ["How has the current service been working for you?"], "watch": "Fecha de renovación = tu único trigger real de timing. Señales de insatisfacción.", "avoid": ["Discutir", "Criticar al proveedor"], "next": "Registrar fecha de renovación → recordatorio en CRM.", "crm": "Proveedor actual, fecha de renovación, nivel de satisfacción.", "st": 4}, {"ch": "outbound", "sit": "Preguntan por qué llamo", "what": "Quieren contexto. Explica el motivo real, nunca digas que llamas a vender.", "do": "Contexto breve + pregunta.", "say": ["We were reviewing your website and couldn't find your vendor process, so I was hoping someone could point me in the right direction."], "ask": [], "watch": "Si el tono es corto, ofrece reagendar.", "avoid": ["Pitch"], "next": "Pasar al decisor o descubrir el proceso.", "crm": "Contacto, tipo de instalación, necesidad, próximo paso y fecha.", "st": 2}, {"ch": "outbound", "sit": "El prospecto pide precio", "what": "Sin alcance, un número destruye margen y credibilidad. Entiende su estructura de precio primero.", "do": "Muestra disposición, aclara servicio y estructura, propón walkthrough para precisión.", "say": ["I'd love to give you an accurate number — can we set up a quick walkthrough first? That way the proposal reflects exactly what you need instead of a guess.", "How do you normally evaluate pricing for this type of service — square footage, scope, or a bid range?"], "ask": ["Is there a bid range or budget we should be aware of?", "What services are included in what you're paying today?"], "watch": "Estructura de precio existente; presupuesto firme vs. flexible.", "avoid": ["Cotizar sin alcance", "Negociar contra ti mismo"], "next": "Módulo de precio → walkthrough.", "crm": "Estructura de precio, rango.", "st": 3}, {"ch": "outbound", "sit": "El prospecto muestra interés", "what": "El interés suena a preguntas: seguros, ubicaciones, referencias, tiempos.", "do": "Responde y devuelve una pregunta relacionada. Avanza hacia conocer las instalaciones.", "say": ["Absolutely. How many locations are you managing today, and are they all in the same area?", "Of course — I can send two or three references from properties similar to yours. What type would be most relevant?"], "ask": ["Is there a deadline driving this — a contract renewal or a new project?"], "watch": "Fecha límite real; documentación requerida.", "avoid": ["Seguir vendiendo por teléfono"], "next": "Cerrar hacia walkthrough.", "crm": "Ubicaciones, referencias solicitadas, deadline.", "st": 4}, {"ch": "outbound", "sit": "“Just send me an email”", "what": "Sin contexto, el email es genérico y no habrá seguimiento.", "do": "Acepta, pregunta qué quiere ver y acuerda el seguimiento antes de colgar.", "say": ["Absolutely, I'd be happy to. Just so I send the most relevant info — what would you like to see?", "And once you've had a chance to look it over, would Thursday or Friday work for a quick follow-up?"], "ask": ["Is there anything specific your team looks for when evaluating a vendor?"], "watch": "Si no da contexto ni fecha → riesgo; registra y reintenta.", "avoid": ["Colgar con “I'll send you an email”", "Enviar información genérica"], "next": "Enviar info relevante hoy + seguimiento agendado.", "crm": "Qué pidió ver, fecha de seguimiento.", "st": 7}, {"ch": "outbound", "sit": "“We're not interested”", "what": "Un “no por ahora” es una fecha futura que aún no tienes agendada.", "do": "Agradece, no discutas, pregunta por la renovación.", "say": ["I completely understand — thank you for taking a few minutes today. If your needs ever change, we'd love the chance to introduce ourselves.", "That makes sense. Out of curiosity, when does your current agreement typically come up for renewal?"], "ask": [], "watch": "Si viene de recepción, no es un no del decisor.", "avoid": ["Insistir", "Discutir"], "next": "Fecha futura en CRM → nurture.", "crm": "Motivo, fecha de renovación.", "st": 7}, {"ch": "outbound", "sit": "Necesito la fecha de renovación", "what": "Es tu único trigger real de timing.", "do": "Pregúntala directamente y o. Out of curiosity, when does your current agreement come up for renewal?", "then": "Would it be alright if I reached back out closer to that time?", "next": "Recordatorio de seguimiento en CRM en la fecha de renovación.", "cat": "Lealtad", "avoid": ["Criticar al proveedor actual"]}, {"obj": "Just send me an email.", "type": "Evasión", "ch": "OB", "why": "Sin contexto, el email es genérico y no habrá seguimiento.", "say": "Absolutely, I'd be happy to. Just so I send the most relevant info — what would you like to see?", "then": "And once you've had a chance to look it over, would Thursday or Friday work for a quick follow-up?", "next": "Enviar info relevante el mismo día + seguimiento agendado.", "cat": "Evasión", "avoid": ["Enviar info genérica sin seguimiento"]}, {"obj": "Your price is higher than another company.", "type": "Precio", "ch": "IB", "why": "Comparan número sin comparar alcance, supervisión ni confiabilidad. Usa Feel–Felt–Found y ROI.", "say": "I completely understand how you feel. Several of our clients initially felt the same way when comparing proposals. What they found was that choosing a provider based on reliability, communication and consistent quality helped them avoid many of the issues they had experienced before.", "then": "Can you help me understand what you're comparing — is it the same scope and frequency?", "next": "Confirmar que la objeción fue resuelta: “Does that make sense?”", "cat": "Precio", "avoid": ["Inventar un número", "Negociar contra ti mismo", "Cotizar sin alcance"]}, {"obj": "I'm just comparing options.", "type": "Comparación", "ch": "IB", "why": "Es normal y una señal positiva: está buscando activamente.", "say": "That's a smart way to approach it. What criteria matter most to you as you compare — so I can make sure the proposal addresses exactly that?", "then": "Would it help if I included a side-by-side of scope and frequency so it's easy to compare?", "next": "Propuesta con comparación clara + fecha de revisión.", "cat": "Comparación", "avoid": ["Bajar precio para ganar la comparación"]}, {"obj": "I need to think about it.", "type": "Timing", "ch": "IB / OB", "why": "Normalmente falta información o confianza, no tiempo. Usa Labeling y una pregunta.", "say": "Of course. It sounds like you want to make the best long-term decision. Is there anything specific you'd like more clarity on before deciding?", "then": "What would make this an easy yes for you?", "next": "Resolver la duda; agendar fecha concreta de decisión.", "cat": "Timing", "avoid": ["Presionar", "Colgar sin fecha"]}, {"obj": "I need to talk to my partner / boss.", "type": "Decisor", "ch": "IB / OB", "why": "Hay otro decisor. Ayúdale a presentar el caso y ofrece estar en la conversación.", "say": "That makes sense. What do you think will matter most to them? I'd be happy to join a quick call with both of you so we can answer questions directly.", "then": "Would it help if I sent a one-page summary you can share with them?", "next": "Agendar llamada con ambos decisores.", "cat": "Decisor", "avoid": ["Presentar a quien no decide"]}, {"obj": "We're not ready yet.", "type": "Timing", "ch": "IB / OB", "why": "Descubre qué tiene que pasar primero y ancla una fecha.", "say": "Completely understandable. What needs to happen on your side before this becomes a priority?", "then": "Would it make sense for me to check back in [month] so we can plan ahead of that?", "next": "Fecha futura en CRM + nurture mensual.", "cat": "Timing", "avoid": ["Presionar", "Colgar sin fecha"]}, {"obj": "Our current company is cheaper.", "type": "Precio", "ch": "IB", "why": "Si están hablando contigo, el precio no está resolviendo el problema.", "say": "I understand. Can I ask — if the price is working for you, what made you take this call today?", "then": "It sounds like the issue isn't cost, it's [consistency]. Would it be fair to say that's what you're really trying to solve?", "next": "Reposicionar en valor y ROI; walkthrough.", "cat": "Precio", "avoid": ["Inventar un número", "Negociar contra ti mismo", "Cotizar sin alcance"]}, {"obj": "We had a bad experience with a cleaning company before.", "type": "Confianza", "ch": "IB", "why": "Label la preocupación y describe cómo se previene (supervisión, contacto directo, inspecciones).", "say": "It seems that your biggest concern is avoiding another bad experience. That's completely fair. What went wrong last time?", "then": "Here's how we prevent exactly that: a dedicated point of contact, scheduled quality inspections and a documented scope.", "next": "Ofrecer referencias similares; walkthrough.", "cat": "Confianza", "avoid": ["Prometer lo que no controlas"]}, {"obj": "Can you just give me a ballpark price?", "type": "Precio", "ch": "IB / OB", "why": "Un número sin alcance destruye margen y credibilidad.", "say": "I'd love to give you an accurate number — can we set up a quick walkthrough first? That way the proposal reflects exactly what you need instead of a guess.", "then": "Would this week or next work better?", "next": "Agendar walkthrough.", "cat": "Precio", "avoid": ["Inventar un número", "Negociar contra ti mismo", "Cotizar sin alcance"]}, {"obj": "We're not interested. (recepción)", "type": "Gatekeeper", "ch": "OB", "why": "No discutas con quien no decide.", "say": "I completely understand — thank you. Just so I reach the right person, who normally handles your commercial cleaning vendors?", "then": "Is there a better time to reach them?", "next": "Registrar nombre del decisor y reintentar.", "cat": "Gatekeeper", "avoid": ["Discutir con el filtro"]}, {"obj": "Just send me your pricing.", "type": "Precio", "cat": "Precio", "ch": "IB / OB", "why": "Quiere comparar por número sin alcance. Entiende su estructura antes de enviar algo.", "say": "Happy to. So the numbers actually make sense for you — how do you normally evaluate pricing for this type of service: square footage, scope, or a bid range?", "then": "What's included in what you're comparing today?", "next": "Enviar estructura/propuesta con alcance definido + seguimiento agendado.", "avoid": ["Enviar una lista de precios genérica", "Inventar un número"]}, {"obj": "Can you match our current provider?", "type": "Precio", "cat": "Precio", "ch": "IB", "why": "Quiere saber si hay flexibilidad. No aceptes ni rechaces automáticamente; entiende qué incluye.", "say": "That's helpful to know. Let me make sure I understand exactly what's included at that rate, because scope and condition can make a significant difference. If the scope is comparable, we can look at the overall workload and determine the most appropriate structure.", "then": "Is that the current rate you're paying, or the budget you're working with for a new provider?", "next": "Comparar alcance → consultar precio aprobado / manager → propuesta.", "avoid": ["Prometer igualar sin aprobación", "Rechazar de entrada"]}, {"obj": "If you can stay within this range, we can talk.", "type": "Precio", "cat": "Precio", "ch": "IB / OB", "why": "Tienes el rango: ahora confirma qué incluye y si el alcance encaja.", "say": "We can use that as a starting point and review the actual scope. Depending on the condition, frequency and amount of work required, there may be some flexibility in how we structure the service.", "then": "What services are included in that range, and how often?", "next": "Walkthrough → validar alcance → consultar precio aprobado si es necesario.", "avoid": ["Aceptar sin ver el alcance", "Negociar contra ti mismo"]}], "objCats": ["Precio", "Timing", "Lealtad", "Confianza", "Decisor", "Gatekeeper", "Comparación", "Evasión"], "techniques": [["Feel – Felt – Found (FFF)", "Responder objeciones sin confrontar.", "Feel: reconoce cómo se siente. Felt: otros clientes sintieron lo mismo. Found: lo que descubrieron al trabajar con nosotros.", "I completely understand how you feel. Several of our clients initially felt the same way. What they found was…"], ["Labeling", "Verbalizar la preocupación que percibes.", "Hace que el cliente se sienta comprendido y baja la tensión.", "It sounds like consistency is extremely important to your team. / It seems your biggest concern is avoiding another bad experience."], ["Mirroring", "Repetir la palabra clave para invitar a profundizar.", "El cliente amplía sin sentirse interrogado.", "Client: “We've had several issues with communication.” — You: “Communication?”"], ["Silencio estratégico", "Callar después de una pregunta importante.", "Activa reciprocidad; el prospecto llena el espacio.", "Could you point me in the right direction? [silencio total]"], ["Confirmación / Resumen", "Repetir lo entendido antes de avanzar.", "Evita malentendidos y demuestra atención.", "Just to make sure I understand correctly, you're looking for… Is that correct?"], ["Problema – Solución – Beneficio", "Estructura de toda presentación.", "Reconoce la necesidad, explica cómo la resolvemos, describe el resultado.", "You mentioned missed cleanings. We work with defined schedules and operational supervision, so you get consistent service and fewer interruptions."], ["Cierre por alternativas", "Ofrecer dos opciones, nunca sí/no.", "El cliente mantiene el control mientras avanza.", "Would Tuesday or Thursday work better for the walkthrough? / Morning or evening service?"], ["Cierre asumido", "Avanzar al siguiente paso lógico como algo natural.", "Solo cuando el cliente ya confirmó valor.", "The next step would be scheduling a walkthrough so we can prepare an accurate proposal."], ["Urgencia real", "Basada en hechos, nunca presión artificial.", "Agenda limitada, fecha de inicio del cliente, fin de contrato, post-construcción con fecha.", "To make sure we can accommodate your preferred start date, I'd recommend scheduling the walkthrough as soon as possible."], ["Responder y devolver", "Cada pregunta del prospecto es una puerta.", "Responde y devuelve una pregunta relacionada.", "Yes, we're insured. Are those documents typically requested during your vendor approval process?"]], "buy": [["“When could you start?”", "Ya evalúa cómo trabajar contigo, no si trabajará contigo.", "Preguntar la fecha límite real y cerrar por alternativas."], ["“What's the next step?”", "Quiere que le guíes el proceso.", "Proponer walkthrough o propuesta con dos opciones de fecha."], ["“Do you need to visit the property?”", "Visualiza la visita.", "Agendar walkthrough: “Tuesday or Thursday?”"], ["“What documentation do you need?”", "Hay proceso formal; ya piensa en aprobación.", "Confirmar exactamente qué necesitan y enviarlo hoy con seguimiento."], ["“Are you insured?”", "Verifica requisitos de vendor.", "Confirmar GL y WC; preguntar si es parte de su proceso de aprobación."], ["“Can you handle multiple locations?”", "Está pensando en escala.", "Confirmar y preguntar cuántas maneja hoy."], ["“Do you have references?”", "Busca reducir riesgo.", "Ofrecer 2–3 referencias de su industria."], ["Contrato por finalizar / proveedor incumple", "Urgencia real.", "Registrar fecha; acelerar walkthrough."]], "risk": [["Respuestas muy cortas", "Mal momento o falta de interés.", "Una pregunta directa más; ofrecer reagendar."], ["No hay decisor identificado", "Puedes estar vendiendo a quien no decide.", "Preguntar quién decide y quién más participa."], ["Solo hablas con recepción", "No has llegado al proceso real.", "Pedir con cortesía el responsable de vendors."], ["Precio pedido muy pronto", "Comparación por número, sin alcance.", "Entender su estructura de precio; redirigir a walkthrough."], ["“Just send me an email” sin calificación", "Evasión educada.", "Preguntar qué quiere ver y acordar seguimiento."], ["Sin siguiente paso claro", "La oportunidad se enfría.", "Cierre por alternativas antes de colgar."], ["Proceso de compra poco claro", "Puede haber portal, RFP o múltiples decisores.", "Preguntar cómo evalúan y quién aprueba."]], "prospects": [["Property management", ["Consistencia entre múltiples propiedades", "Un solo punto de contacto", "Reportes"], ["Inconsistencia entre edificios", "Mismo estándar, supervisión y reportes por propiedad", "Menos quejas y una sola llamada para todo"]], ["General contractor", ["Cronogramas flexibles", "Plazos ajustados", "Post-construction"], ["Fechas de entrega que se mueven", "Equipo que trabaja alrededor de cronogramas cambiantes", "Entrega a tiempo sin retrasar el proyecto"]], ["Oficina / médico", ["Protocolos", "Consistencia", "Atención al detalle", "Desinfección de alto contacto"], ["Calidad inconsistente y riesgo de cumplimiento", "Protocolos documentados e inspecciones", "Instalación siempre lista para pacientes y auditorías"]], ["HOA / multifamiliar", ["Áreas comunes", "Quejas de residentes", "Horarios sin interrumpir"], ["Quejas de residentes", "Horarios acordados y estándar visible en áreas comunes", "Menos quejas, mejor imagen de la comunidad"]], ["Hospitality / retail", ["Imagen ante el cliente", "Servicio after-hours", "Respuesta rápida"], ["Espacios que el cliente ve sucios", "Servicio fuera de horario y contacto directo", "Imagen impecable en horas de operación"]], ["Industrial / warehouse", ["Seguridad", "Escala", "Cumplimiento", "Pressure washing"], ["Escala y seguridad", "Equipo dimensionado y procedimientos de seguridad", "Operación limpia sin detener producción"]]], "closes": [["Walkthrough close", "El proyecto requiere inspección.", "Would next Tuesday morning or Wednesday afternoon work better for the walkthrough?"], ["Proposal close", "Ya tienes toda la información.", "I'll prepare a detailed proposal based on everything we've discussed. Would you like it by email today, or should we review it together tomorrow?"], ["Simple service close", "Alcance claro, sin visita.", "Based on the information you've provided, we can certainly help with that. Let's go over the service details so we can get everything scheduled."], ["Alternative close", "Siempre: dos opciones, nunca sí/no.", "Would you prefer morning service or evening service? / Is Tuesday or Thursday better for stalación", "Define alcance y ruta."], ["Servicios solicitados y necesidades principales", "Base de la propuesta."], ["Objeción específica", "Te dice exactamente qué resolver en el próximo contacto."], ["Nombre del decision maker", "Sin esto, cada llamada empieza de cero."], ["Proceso de compra (portal, RFP, referidos)", "Define tu estrategia de seguimiento."], ["Fecha de renovación del contrato actual", "Tu único trigger real de timing."], ["Próximo paso acordado + fecha de seguimiento", "El compromiso que evita que la oportunidad muera."], ["Estado de la oportunidad y tono de la llamada", "Te dice si insistir pronto o esperar."]], "crmAfter": ["Contacto", "Instalación / servicio", "Necesidad", "Dolor", "Impacto", "Objeciones", "Decision maker", "Proceso de compra", "Fecha de renovación", "Siguiente paso", "Fecha del siguiente paso", "Estado de la oportunidad"], "kpis": {"outbound": [["Llamadas realizadas", "80"], ["Conversaciones reales", "12"], ["Decision makers contactados", "5"], ["Walkthroughs agendados", "2"], ["Propuestas enviadas", "1"], ["Clientes cerrados", "1"]], "inbound": [["Tiempo de respuesta", "< 3 timbres"], ["Llamadas calificadas", "≥ 80%"], ["Walkthrough / propuesta agendada", "≥ 60% de calificadas"], ["Propuesta enviada a tiempo", "100%"], ["Seguimiento dentro del plazo", "100%"], ["Cierre", "≥ 30% de propuestas"]], "linkedin": [["Solicitudes por día", "20–30"], ["Conexiones nuevas por semana", "100–150"], ["Tasa de aceptación", "≥ 30%"], ["Tasa de respuesta a mensaje", "≥ 15%"], ["Reuniones agendadas / mes", "4+"], ["Conversiones a vendor / mes", "1+"]], "coach": "Si tus conversaciones reales están muy por debajo de 12 de cada 80 llamadas, el problema está en la apertura, no en el cierre."}, "rules": ["Nunca vendas antes de descubrir.", "Nunca hables más del 40% de la llamada (20% en inbound).", "Nunca termines una llamada sin un siguiente paso con fecha.", "Nunca envíes un correo sin acordar el seguimiento.", "Nunca discutas con un “no”.", "Nunca improvises información que no tienes.", "Nunca cotices sin conocer el alcance.", "Siempre deja notas en el CRM antes de la siguiente llamada.", "Siempre confirma quién decide.", "Siempre trata cada “no por ahora” como una oportunidad futura.", "Siempre cumple lo prometido: la propuesta y la llamada, a la hora dicha.", "Siempre confirma que la objeción fue resuelta antes de avanzar."], "cases": [["Presentar antes de preguntar", "El representante habló de la empresa 5 minutos antes de preguntar algo. El prospecto cortó.", "Presentó antes de descubrir.", "Abrir con la pregunta sobre el proceso de vendor y dejar hablar al prospecto.", "El prospecto comparte su proceso interno y queda abierta una segunda llamada."], ["Cotizar sin walkthrough", "El prospecto preguntó el precio en el minuto dos y el representante cotizó.", "Dio un número sin información suficiente.", "“I'd love to give you an accurate number — can we set up a quick walkthrough first?”", "Propuesta con margen correcto y más credibilidad."], ["Discutir con un filtro", "La recepcionista dijo “we're not interested” y el representante insistió con ella.", "Discutió con alguien que no decide.", "Agradecer y pedir el nombre del responsable de vendors.", "Contacto correcto para el próximo intento."], ["Colgar sin calificar", "El prospecto pidió un email y el representante colgó sin preguntar más.", "Perdió la oportunidad de calificar.", "Preguntar qué le gustaría ver antes de colgar.", "Envío relevante y seguimiento acordado."]], "quiz": [{"case": "El prospecto pide el precio en el minuto dos.", "a": "It's usually around $X per month for an office that size.", "b": "I'd love to give you an accurate number — can we set up a quick walkthrough first? How do you normally evaluate pricing for this type of service?", "ans": "b", "why": "Sin alcance, un número destruye margen y credibilidad. Entiende su estructura de precio primero."}, {"case": "La recepcionista dice “we're not interested”.", "a": "I understand, but  <div class="grid g2"><div class="panel"><div class="hd"><h2>Role-plays</h2></div><div class="bd tight"><table>${D.roleplays.map(r=>`<tr><td class="k">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div></div>
 <div class="panel"><div class="hd"><h2>Cases</h2></div><div class="bd" style="padding-top:0">${D.cases.map((c,i)=>`<details ${i===0?"open":""}><summary>Case ${i+1} · ${esc(c[0])}</summary><div class="db"><p><b>What happened:</b> ${esc(c[1])}</p><p style="color:var(--red)"><b>What went wrong:</b> ${esc(c[2])}</p><p style="color:var(--green)"><b>What should have happened:</b> ${esc(c[3])}</p><p style="margin:0"><b>Expected result:</b> ${esc(c[4])}</p></div></details>`).join("")}</div></div></div>
 <div class="panel quiz"><div class="hd"><h2>Practice · which response is better?</h2></div><div class="bd grid g2">${D.quiz.map((q,i)=>`<div data-q="${i}"><b style="font-size:13px;color:var(--ink)">${esc(q.case)}</b><button class="opt" data-o="a">A · ${esc(q.a)}</button><button class="opt" data-o="b">B · ${esc(q.b)}</button><div class="fb hint"></div></div>`).join("")}</div></div>`;
 $("#t-coaching").onclick=e=>{const o=e.target.closest(".opt");if(!o)return;const card=o.closest("[data-q]"),q=D.quiz[+card.dataset.q];card.querySelectorAll(".opt").forEach(b=>{b.classList.remove("good","badc");if(b.dataset.o===q.ans)b.classList.add("good");else if(b===o)b.classList.add("badc")});card.querySelector(".fb").innerHTML=(o.dataset.o===q.ans?`<b style="color:var(--green)">Correct.</b> `:`<b style="color:var(--red)">The other one.</b> `)+esc(q.why)}}
function playbook(){$("#t-playbook").innerHTML=`<div class="ph"><div><span class="lbl">Playbook</span><h1>Principles, rules, techniques, reference</h1></div></div>
 <div class="grid g2"><div class="panel"><div class="hd"><h2>The 4 principles</h2></div><div class="bd">${D.principles.map((p,i)=>`<p style="font-size:13px;margin:0 0 8px"><b style="color:var(--green)">0${i+1}</b> <b>${esc(p[0])}.</b> <span style="color:var(--muted)">${esc(p[1])}</span></p>`).join("")}<p class="hint" style="margin:0">People are not buying cleaning. They are buying confidence that the property is in good hands.</p></div></div>
 <div class="panel"><div class="hd"><h2>The 12 Regulus Rules</h2></div><div class="bd tight"><table>${D.rules.map((r,i)=>`<tr><td class="num" style="width:44px;color:var(--green)">${String(i+1).padStart(2,"0")}</td><td class="k">${esc(r)}</td></tr>`).join("")}</table></div></div></div>
 <div class="panel"><div class="hd"><h2>Techniques</h2></div><div class="bd" style="padding-top:0">${D.techniques.map(t=>`<details><summary>${esc(t[0])} <span class="hint" style="font-weight:400">— ${esc(t[1])}</span></summary><div class="db"><p>${esc(t[2])}</p>${say(t[3])}</div></details>`).join("")}</div></div>
 <div class="grid g2">${ckCard(D.checklists[0][0],D.checklists[0][1],"precall")}${ckCard(D.checklists[2][0],D.checklists[2][1],"qualify")}</div>
 <div class="panel"><div class="hd"><h2>Glossary</h2></div><div class="bd tight"><table>${D.glossary.map(g=>`<tr><td class="k">${esc(g[0])}</td><td>${esc(g[1])}</td></tr>`).join("")}</table></div></div>`;bindCk("#t-playbook")}
/* ---------- CONTEXT PANEL ---------- */
function ctx(){const t=state.tab;let h="";const s=D.live[state.sit];const st=D.stages[state.stage];const r=roleDef();
 if(t==="live"&&s)h=`<div class="lbl">Role · Channel · Stage</div><p style="font-size:12.5px;margin:4px 0 12px"><b>${r.code}</b> · ${esc(CH[s.ch])} · ${String(D.stages[(s.st||1)-1].n).padStart(2,"0")} ${esc(D.stages[(s.st||1)-1].en)}</p>${nba(s.next)}<div class="lbl" style="margin:12px 0 6px">Buying signals</div>${D.buy.slice(0,4).map(b=>`<p style="font-size:12px;margin:0 0 4px"><span class="dot g"></span> ${esc(b[0])}</p>`).join("")}<div class="lbl" style="margin:12px 0 6px">Risk signals</div>${D.risk.slice(0,4).map(b=>`<p style="font-size:12px;margin:0 0 4px"><span class="dot r"></span> ${esc(b[0])}</p>`).join("")}`;
 else if(t==="overview"||t==="pipeline"||t==="kpis"){const n=nbaToday();const p=todayPlan();h=`${nba(n[0])}${n.slice(1).map(x=>`<div class="note" style="font-size:12px">${esc(x)}</div>`).join("")}<div class="lbl" style="margin:12px 0 4px">Plan</div><p style="font-size:12.5px;margin:0">${p.stateName}</p><p class="hint" style="margin:4px 0 0">${esc(p.reason)}</p><p class="hint" style="margin:8px 0 0">${state.view==="manager"?"Manager view: where is the sales process breaking?":"Rep view: what do I need to accomplish today?"}</p>`}
 else if(t==="process")h=`<div class="lbl">Stage</div><p style="font-size:12.5px"><b>${String(st.n).padStart(2,"0")} ${esc(st.en)}</b> · ${esc(st.obj)}</p>${nba(st.n<12?`Exit → ${D.stages[st.n].en}`:"Upsell → referral")}`;
 else h=`<div class="lbl">Principle</div><p style="font-size:12.5px">${esc(D.principles[Math.abs(t.length)%4][1])}</p>${nba("Never leave without a dated next step")}<div class="lbl" style="margin:12px 0 6px">Rule</div><p style="font-size:12px">${esc(D.rules[t.length%12])}</p>`;
 $("#ctx").innerHTML=h;const m=$("#mnba");if(t==="live"&&s){m.innerHTML=`<span class="lbl">Next best action</span><br>→ ${esc(s.next)}`;m.classList.add("on")}else m.classList.remove("on")}
/* ---------- SEARCH ---------- */

const IDX=[];
D.live.forEach((s,i)=>IDX.push({c:"Live · "+CH[s.ch],t:s.sit,txt:[s.sit,s.what,s.do,...s.say,...s.ask,s.watch,s.next].join(" "),go:()=>{state.ch=s.ch;store.set("ch",s.ch);state.sit=i;store.set("sit",i);live();show("live")}}));
D.stages.forEach((s,i)=>IDX.push({c:"Stage",t:`${String(s.n).padStart(2,"0")} ${s.en} / ${s.es}`,txt:[s.obj,s.what,...s.q,...s.s,s.listen,...s.exit].join(" "),go:()=>{state.stage=i;store.set("stage",i);process();show("process")}}));
D.objections.forEach(o=>IDX.push({c:"Objection · "+o.cat,t:`“${o.obj}”`,txt:[o.obj,o.why,o.say,o.then,o.next].join(" "),go:()=>{state.objCat=o.cat;objections();show("objections")}}));
D.questions.forEach(([t,qs])=>qs.forEach(q=>IDX.push({c:"Discovery",t:q,txt:q+" "+t,go:()=>show("discovery")})));
D.pricingQuestions.forEach(q=>IDX.push({c:"Pricing",t:q,txt:q,go:()=>show("pricing")}));D.pricingFlex.forEach(q=>IDX.push({c:"Pricing · language",t:q.slice(0,70)+"…",txt:q,go:()=>show("pricing")}));
D.pricingServices.forEach(s=>IDX.push({c:"Pricing · service",t:s.name,txt:[s.name,...s.discover,...s.structure,s.ballpark,s.walk,s.flex].join(" "),go:()=>{state.svc=s.id;pricing();show("pricing")}}));
D.prospects.forEach(p=>IDX.push({c:"Prospect type",t:p[0],txt:[p[0],...p[1],...p[2]].join(" "),go:()=>show("proposal")}));
D.buy.forEach(b=>IDX.push({c:"Buying signal",t:b[0],txt:b.join(" "),go:()=>show("closing")}));D.risk.forEach(b=>IDX.push({c:"Risk signal",t:b[0],txt:b.join(" "),go:()=>show("closing")}));
D.closes.forEach(c=>IDX.push({c:"Closing",t:c[0],txt:c.join(" "),go:()=>show("closing")}));D.techniques.forEach(t=>IDX.push({c:"Technique",t:t[0],txt:t.join(" "),go:()=>show("playbook")}));
Object.entries(D.walkCk).forEach(([k,items])=>items.forEach(it=>IDX.push({c:"Walkthrough · "+k,t:it,txt:it,go:()=>show("walkthrough")})));
D.followup.forEach(f=>IDX.push({c:"Follow-up",t:f[0]+" · "+f[1].slice(0,50),txt:f.join(" "),go:()=>show("followup")}));D.crmAfter.forEach(f=>IDX.push({c:"CRM",t:f,txt:f,go:()=>show("crm")}));
Object.values(D.roleDefs).forEach(r=>IDX.push({c:"Role",t:r.code+" · "+r.name,txt:[r.name,r.tagline,...r.responsibilities].join(" "),go:()=>{state.role=r.code;store.set("role",r.code);show("kpis")}}));D.emailTemplates.forEach(t=>IDX.push({c:"Email",t:t[0],txt:t.join(" "),go:()=>show("followup")}));
D.smsKpis.forEach(k=>IDX.push({c:"KPI · SMS",t:k[0],txt:k.join(" "),go:()=>show("kpis")}));D.rules.forEach((r,i)=>IDX.push({c:"Rule",t:`${i+1}. ${r}`,txt:r,go:()=>show("playbook")}));
D.cases.forEach(c=>IDX.push({c:"Case",t:c[0],txt:c.join(" "),go:()=>show("coaching")}));D.roleplays.forEach(r=>IDX.push({c:"Coaching · role-play",t:r[0],txt:r.join(" "),go:()=>show("coaching")}));D.glossary.forEach(g=>IDX.push({c:"Glossary",t:g[0],txt:g.join(" "),go:()=>show("playbook")}));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function excerpt(txt,v){const t=norm(txt),i=t.indexOf(v);if(i<0)return txt.slice(0,90);const a=Math.max(0,i-40);return(a>0?"…":"")+txt.slice(a,i+v.length+60)+"…"}
let hits=[];
$("#q").addEventListener("input",e=>{const v=norm(e.target.value.trim());const box=$("#results");if(v.length<2){box.style.display="none";return}const words=v.split(/\s+/);hits=IDX.map(x=>({x,score:words.reduce((s,w)=>s+(norm(x.t).includes(w)?3:0)+(norm(x.txt).includes(w)?1:0),0)})).filter(h=>h.score>0).sort((a,b)=>b.score-a.score).slice(0,14).map(h=>h.x);
 box.style.display="block";box.innerHTML=hits.length?hits.map((h,i)=>`<div class="it"><div><div class="c">${esc(h.c)}</div><div class="t">${esc(h.t)}</div><div class="x">${esc(excerpt(h.txt,words[0]))}</div></div><button class="btn sm d" data-h="${i}">Open</button></div>`).join(""):`<div class="it"><div class="t">No results.</div></div>`});
$("#results").addEventListener("click",e=>{const b=e.target.closest("[data-h]");if(!b)return;hits[+b.dataset.h].go();$("#results").style.display="none";$("#q").value=""});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("#results").style.display="none"});
/* ---------- boot ---------- */
overview();live();["inbound","outbound","sms","linkedin"].forEach(channelPage);process();discovery();objections();pricing();closing();walkthrough();proposal();followup();crm();pipeline();kpis();coaching();playbook();
$$("#viewseg button").forEach(b=>b.classList.toggle("on",b.dataset.v===state.view));cmdbar();show(state.tab,true);
</script>
</body>
</html>
